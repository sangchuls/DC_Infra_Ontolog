<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데이터센터 설계검토 에이전트</title>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --border: #e2e2e0;
    --text: #1c1c1a; --muted: #8a8a86; --accent: #1e40af;
    --bubble-user: #1e40af; --bubble-user-text: #fff;
    --bubble-bot: #f0efec; --bubble-bot-text: #1c1c1a;
    --error: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  select {
    font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
  }
  .header-controls { display: flex; align-items: center; gap: 8px; position: relative; }
  #settings-btn {
    background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; font-weight: 400; cursor: pointer;
  }
  #settings-btn:hover { background: var(--bg); }
  #settings-panel {
    position: absolute; top: 40px; right: 0; width: 300px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    z-index: 10; display: flex; flex-direction: column; gap: 10px;
  }
  #settings-panel h3 { margin: 0 0 2px; font-size: 13px; }
  #settings-panel .hint { font-size: 11px; color: var(--muted); margin: 0 0 6px; line-height: 1.5; }
  #settings-panel label { font-size: 12px; color: var(--muted); }
  #settings-panel input {
    width: 100%; font-size: 13px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border);
    margin-top: 3px; font-family: monospace;
  }
  #settings-panel .save-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #settings-save { padding: 6px 16px; font-size: 13px; }
  #settings-saved-msg { font-size: 11px; color: #15803d; display: none; }
  /* #settings-panel의 id 선택자가 display:flex를 지정해서 [hidden]의 display:none보다 우선순위가 높아짐 —
     이 규칙으로 hidden일 때 확실히 안 보이게 한다 */
  #settings-panel[hidden] { display: none; }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); color: var(--bubble-bot-text); border-bottom-left-radius: 4px; }
  .msg.bot.error { background: #fee2e2; color: var(--error); }
  .msg .meta { font-size: 10px; opacity: .55; margin-bottom: 4px; }
  .msg.loading { align-self: flex-start; background: var(--bubble-bot); color: var(--muted); font-style: italic; }
  .evidence { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .evidence a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; background: #fff; color: var(--accent);
    border: 1px solid var(--accent); text-decoration: none; white-space: nowrap;
  }
  .evidence a:hover { background: var(--accent); color: #fff; }
  .evidence a::before { content: "📐"; }
  form#composer {
    display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; line-height: 1.4; height: 52px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #empty-hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>데이터센터 설계검토 에이전트</h1>
      <div class="sub">설계 조건을 입력하면 tool 계산 결과에 근거한 검토의견서를 생성합니다</div>
    </div>
    <div class="header-controls">
      <select id="provider"></select>
      <button type="button" id="settings-btn">⚙ 내 API 키</button>
      <div id="settings-panel" hidden>
        <h3>내 API 키 (이 브라우저에만 저장)</h3>
        <p class="hint">여기 입력한 키는 서버에 저장되지 않고 이 브라우저의 localStorage에만 남습니다.
          비워두면 서버에 설정된 기본 키를 사용합니다.</p>
        <div>
          <label for="key-anthropic">Anthropic (Claude) API 키</label>
          <input type="password" id="key-anthropic" placeholder="sk-ant-..." autocomplete="off" />
        </div>
        <div>
          <label for="key-gemini">Gemini API 키</label>
          <input type="password" id="key-gemini" placeholder="AIza..." autocomplete="off" />
        </div>
        <div class="save-row">
          <span id="settings-saved-msg">저장됨</span>
          <button type="button" id="settings-save">저장</button>
        </div>
      </div>
    </div>
  </header>

  <div id="messages">
    <div id="empty-hint">예: "가평 데이터센터 대안-1(100MW) 검토 내용을 요약하고, 발전기 Cummins 3500kW 17대 기준 급배기 개구면적을 계산해줘"</div>
  </div>

  <form id="composer">
    <textarea id="input" placeholder="설계 조건을 입력하세요... (Shift+Enter 줄바꿈, Enter 전송)"></textarea>
    <button type="submit" id="send-btn">전송</button>
  </form>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const formEl = document.getElementById('composer');
  const sendBtn = document.getElementById('send-btn');
  const providerEl = document.getElementById('provider');
  const emptyHint = document.getElementById('empty-hint');

  // ── 내 API 키 (BYOK) — 이 브라우저의 localStorage에만 저장, 서버 DB엔 안 남음 ──
  const LS_KEY = { anthropic: 'dc_review_key_anthropic', gemini: 'dc_review_key_gemini' };
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  const keyAnthropicEl = document.getElementById('key-anthropic');
  const keyGeminiEl = document.getElementById('key-gemini');
  const settingsSaveBtn = document.getElementById('settings-save');
  const settingsSavedMsg = document.getElementById('settings-saved-msg');

  function loadStoredKeys() {
    try {
      keyAnthropicEl.value = localStorage.getItem(LS_KEY.anthropic) || '';
      keyGeminiEl.value = localStorage.getItem(LS_KEY.gemini) || '';
    } catch (e) { /* localStorage 접근 불가 시(프라이빗 모드 등) 그냥 빈 채로 둠 */ }
  }

  function currentApiKey() {
    try {
      const k = LS_KEY[providerEl.value];
      const v = k && localStorage.getItem(k);
      return v ? v.trim() : '';
    } catch (e) { return ''; }
  }

  settingsBtn.addEventListener('click', () => {
    settingsPanel.hidden = !settingsPanel.hidden;
    settingsSavedMsg.style.display = 'none';
  });
  document.addEventListener('click', (e) => {
    if (!settingsPanel.hidden && !settingsPanel.contains(e.target) && e.target !== settingsBtn) {
      settingsPanel.hidden = true;
    }
  });
  settingsSaveBtn.addEventListener('click', () => {
    try {
      const a = keyAnthropicEl.value.trim(), g = keyGeminiEl.value.trim();
      if (a) localStorage.setItem(LS_KEY.anthropic, a); else localStorage.removeItem(LS_KEY.anthropic);
      if (g) localStorage.setItem(LS_KEY.gemini, g); else localStorage.removeItem(LS_KEY.gemini);
      settingsSavedMsg.style.display = 'inline';
      setTimeout(() => { settingsSavedMsg.style.display = 'none'; }, 1500);
    } catch (e) {
      alert('저장 실패: 브라우저 저장소를 쓸 수 없습니다 (' + e.message + ')');
    }
  });
  loadStoredKeys();

  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      providerEl.innerHTML = '';
      for (const p of cfg.providers) {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p === 'anthropic' ? 'Claude (Anthropic)' : p === 'gemini' ? 'Gemini (Google)' : p;
        if (p === cfg.default_provider) opt.selected = true;
        providerEl.appendChild(opt);
      }
    } catch (e) {
      providerEl.innerHTML = '<option value="anthropic">Claude (Anthropic)</option><option value="gemini">Gemini (Google)</option>';
    }
  }

  function addMessage(role, text, isError, evidence) {
    emptyHint.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role + (isError ? ' error' : '');
    div.textContent = text;

    if (evidence && evidence.length) {
      const box = document.createElement('div');
      box.className = 'evidence';
      for (const ev of evidence) {
        const a = document.createElement('a');
        a.href = ev.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = ev.label;
        box.appendChild(a);
      }
      div.appendChild(box);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage('user', text);
    inputEl.value = '';
    sendBtn.disabled = true;

    const loadingEl = document.createElement('div');
    loadingEl.className = 'msg bot loading';
    loadingEl.textContent = '검토의견서 작성 중...';
    messagesEl.appendChild(loadingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const apiKey = currentApiKey();
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, provider: providerEl.value, api_key: apiKey || undefined }),
      });
      const data = await res.json();
      loadingEl.remove();
      addMessage('bot', data.reply, data.error, data.evidence);
    } catch (err) {
      loadingEl.remove();
      addMessage('bot', '[오류] 서버에 연결할 수 없습니다: ' + err.message, true);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  loadConfig();
</script>
</body>
</html>
